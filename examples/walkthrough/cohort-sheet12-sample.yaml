    assay_type: LC-MS/MS
    acquisition_mode: DDA
    search_engine: FragPipe/MSFragger
    representative_file_arm: breast-cancer fraction arm (interact.pep.xml)
    representative_file_species: Homo sapiens
    files:
      - name: sheet12_sample50.csv
        url: null
