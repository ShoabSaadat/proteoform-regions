# PyPI publishing via OIDC trusted publishing (no stored tokens).
#
# Prerequisites (Shoaib-owned, one-time):
#   1. PyPI  -> account settings -> "Add a new pending publisher"
#      (or Publishing tab of the proteoform-regions project once created):
#        owner:  ShoabSaadat
#        repo:   proteoform-regions
#        workflow: publish.yml
#        environment: pypi
#   2. Same on TestPyPI with environment: testpypi.
#   3. Create the `pypi` and `testpypi` environments in repo Settings ->
#      Environments (they can also enforce required reviewers).
#
# Until (1)/(2) are configured, the upload jobs fail with a
# trusted-publisher error — which is why TestPyPI runs only on manual
# workflow_dispatch and PyPI only on explicit version tags: nothing fires
# automatically from ordinary pushes to main.

name: publish

on:
  workflow_dispatch: # TestPyPI dry-run (manual)
  push:
    tags: ["v*"] # PyPI release (tag push)

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # OIDC trusted publishing
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
